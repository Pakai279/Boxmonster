<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Camera Pose Test</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #111; color: white; }
        #video-container { position: relative; width: 640px; height: 480px; margin-top: 20px; }
        #webcam, #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); } /* المرآة */
        #webcam { object-fit: cover; }
    </style>
</head>
<body>
    <h1>اختبار تتبع الجسم</h1>
    <button id="start-btn">بدء الكاميرا</button>
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script type="module">
        import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const startBtn = document.getElementById("start-btn");
        
        let poseLandmarker;
        let lastVideoTime = -1;

        async function createPoseLandmarker() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
            );
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numPoses: 1
            });
            console.log("Pose Landmarker ready");
        }

        async function startCamera() {
            if (!poseLandmarker) {
                await createPoseLandmarker();
            }
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictWebcam);
        }

        async function predictWebcam() {
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;
            
            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const results = poseLandmarker.detectForVideo(video, startTimeMs);
                
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                if (results.landmarks) {
                    for (const landmarks of results.landmarks) {
                        // هنا كتقدر تحسب الزوايا وكتشاف الحركات
                        // مثلا: landmarks[11] هو الكتف الأيسر، landmarks[13] هو الكوع الأيسر، landmarks[15] هو المعصم الأيسر
                        // landmarks[12], [14], [16] للجهة اليمنى
                        drawLandmarks(landmarks, canvasCtx);
                    }
                }
            }
            requestAnimationFrame(predictWebcam);
        }
        
        function drawLandmarks(landmarks, ctx) {
            // رسم بسيط للنقط والخطوط
            ctx.fillStyle = "#FF0000";
            ctx.strokeStyle = "#00FF00";
            ctx.lineWidth = 2;
            
            // رسم النقط
            for (const point of landmarks) {
                ctx.beginPath();
                ctx.arc(point.x * canvasElement.width, point.y * canvasElement.height, 5, 0, 2 * Math.PI);
                ctx.fill();
            }
            // رسم بعض الخطوط الأساسية (الكتف للكوع للمعصم)
            const connections = [[11,13],[13,15],[12,14],[14,16]];
            connections.forEach(([i, j]) => {
                const p1 = landmarks[i];
                const p2 = landmarks[j];
                ctx.beginPath();
                ctx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
                ctx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
                ctx.stroke();
            });
        }

        startBtn.addEventListener("click", startCamera);
    </script>
</body>
</html>
